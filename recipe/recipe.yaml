schema_version: 1

context:
  version: "2.8.0"

package:
  name: pulp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/P/PuLP/PuLP-${{ version }}.tar.gz
  sha256: 4903bf96110bbab8ed2c68533f90565ebb76aa367d9e4df38e51bf727927c125
  patches:
    # Use the conda provided cbc binary, not those bundled in tar-ball:
    - pulp.cfg.linux.patch
    - pulp.cfg.osx.patch

build:
  number: 3
  script:
    - ${{ PYTHON }} -m pip install . -vv
    # Remove bundled cbc binaries, using coin-or-cbc provided cbc instead:
    - if: not win
      then:
        - rm -rf "${SP_DIR}/pulp/solverdir/cbc"
        - rm "${SP_DIR}/pulp/solverdir/CoinMP.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools
  run:
    - amply >=0.1.2
    - coin-or-cbc
    - python

tests:
  - python:
      imports:
        - pulp
        - pulp.solverdir
      pip_check: true
  - script:
      - python -c "import pulp; assert pulp.LpSolverDefault, 'default solver not available'"

about:
  summary: |
    PuLP is an LP modeler written in python. PuLP can generate MPS or LP files
    and call GLPK, COIN CLP/CBC, CPLEX, and GUROBI to solve linear problems.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/coin-or/pulp
  repository: https://github.com/coin-or/pulp
  documentation: https://pythonhosted.org/PuLP/

extra:
  recipe-maintainers:
    - johanneskoester
    - christopher-schroeder
    - mgorny
